query Common(
  $url: String!
  $scriptPageTypes: [ScriptPageType!]
  $partnerAccessToken: String
) {
  menuGroups(url: $url, partnerAccessToken: $partnerAccessToken) {
    menuGroupId
    position
    imageUrl
    fullImageUrl
    menus {
      menuId
      parentMenuId
      imageUrl
      fullImageUrl
      name
      cssClass
      link
      order
    }
  }
  scripts(url: $url, pageType: $scriptPageTypes) {
    name
    pageType
    position
    priority
    content
  }
  lighboxProducts: hotsite(
    hotsiteId: 98669
    partnerAccessToken: $partnerAccessToken
  ) {
    ...lighboxProducts
  }

  kits: hotsite(hotsiteId: 183759) {
    ...produtos
  }

  # Banners do menu 2026 (mega menu desktop e drawer mobile). Cadastre-os no hotsite com URL "menu-banners"
  # (nomes menu-destaques-N para todos os painéis e menu-<slot>-N para um departamento, onde <slot> é o
  # primeiro trecho do link do departamento). Se o hotsite não existir ou não tiver banners, o menu simplesmente
  # não mostra a coluna de promoções.
  menuBanners: hotsite(url: "menu-banners", partnerAccessToken: $partnerAccessToken) {
    banners {
      bannerName
      bannerUrl
      altText
      title
      urlOnClick
      openNewTab
      width
      height
      order
    }
  }

  # Imagens de RESERVA do menu 2026 (hotsite "menu-fallback"): o menu acha cada uma pelo NOME do banner.
  #   icone-<id>          ícone de categoria escolhido pelo nome do item (ex.: icone-porcelanato)
  #   icone-generico      ícone quando nenhuma regra bate
  #   ambiente-<pasta>    foto do card do ambiente (ex.: ambiente-banheiro)
  #   promocao-1 / -2     promoções de reserva quando "menu-banners" não tem nenhuma
  # Se o hotsite não existir ou o banner não estiver nele, o menu usa o ícone genérico embutido / não mostra a imagem.
  menuFallback: hotsite(url: "menu-fallback", partnerAccessToken: $partnerAccessToken) {
    banners {
      bannerName
      bannerUrl
      altText
      title
      urlOnClick
      openNewTab
      order
    }
  }

  categories(first: 50, onlyRoot: true) {
    nodes {
      hotsiteAlias
      hotsiteUrl
      name
      position
      parentCategoryId
      children {
        hotsiteAlias
        hotsiteUrl
        name
        position
        children {
          hotsiteAlias
          hotsiteUrl
          name
          position
        }
      }
    }
  }
  gtm_id: shopSettings(settingNames: "GoogleTagManagerId") {
    name
    value
  }
  facebook_app_id: shopSettings(settingNames: "Facebook_Login_AppId") {
    name
    value
  }

  google_client_id: shopSettings(settingNames: "Google_Plus_Client_Id") {
    name
    value
  }
}

fragment lighboxProducts on SingleHotsite {
  products(first: 20, sortKey: SALES, sortDirection: DESC) {
    ...productsCon
  }
}

fragment produtos on SingleHotsite {
  products(first: 20, sortKey: SALES, sortDirection: DESC) {
    ...productsCon
  }
}

fragment productsCon on ProductsConnection {
  nodes {
    id
    productId
    productName
    productVariantId
    productBrand {
      fullUrlLogo
      logoUrl
    }
    alias
    similarProducts {
      alias
      image
      name
      imageUrl(w: 50, h: 50)
    }
    images(width: 245, height: 245) {
      url
      print
    }
    available
    prices {
      listPrice
      price
      priceTables {
        id
        listPrice
        price
      }
      discountPercentage
      multiplicationFactor
      installmentPlans {
        displayName
        name
        installments {
          discount
          fees
          number
          value
        }
      }
      bestInstallment {
        name
        displayName
        discount
        fees
        number
        value
      }
    }
    attributes {
      name
      value
    }
    promotions {
      fullStampUrl
      content
      id
      stamp
      title
    }
    addToCartFromSpot
  }
}
