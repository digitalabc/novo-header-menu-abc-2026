<div class="d-flex justify-content-center">
    <div class="col-2">
        <div>
            {{ for image in images }}
                <div class="col-12" style="border-style: solid; border-width: thin; border-top: 0px;">
                    <img src="{{ image.url }}" class="img-fluid" alt="image_{{ math.uuid }}">
                </div>
            {{ end }}
        </div>
    </div>
    <div class="col-10">
        {{~ firstImage = images | array.first ~}}    
        {{ if firstImage }}
            <img src="{{ firstImage.url }}" class="img-fluid" alt="image_{{ math.uuid }}">
        {{ end }}
    </div>
</div>
