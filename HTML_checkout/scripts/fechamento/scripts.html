<script>
  $('#retireEmLoja').click(function () {
    $('.recebaEmCasaMsg').hide();
    $('.retireEmLojaMsg').show();

    $('#retireEmLoja').addClass('active');
    $("#recebaEmCasa").removeClass("active")
    $('#div-frete').addClass('retiradaEmLoja');
    $("#div-frete").removeClass("recebaEmCasa")
    $('.new-checkout .item-frete-option').hide();
    $('.new-checkout .item-frete-option[data-frete-item-tipo="Retirada"]').show();
  });

  $('#recebaEmCasa').click(function () {
    $('.recebaEmCasaMsg').show();
    $('.retireEmLojaMsg').hide();

    $('#recebaEmCasa').addClass('active');
    $("#retireEmLoja").removeClass("active")
    $('#div-frete').addClass('recebaEmCasa');
    $("#div-frete").removeClass("retiradaEmLoja")
    $('.new-checkout .item-frete-option').show();
    $('.new-checkout .item-frete-option[data-frete-item-tipo="Retirada"]').hide();
  });
</script>

<!--Data Layers-->
<script>
  window.dataLayer = window.dataLayer || [];
  const dlp = [];

  $(document).ready(function () {

    for (p = 0; p < Fbits.Carrinho.Produtos.length; p++) {
      dlp.push({
        name: Fbits.Carrinho.Produtos[p].Nome.toString(),
        id: Fbits.Carrinho.Produtos[p].ProdutoId.toString(),
        price: Fbits.Carrinho.Produtos[p].PrecoPor,
        brand: Fbits.Carrinho.Produtos[p].Fabricante.toString(),
        variant: Fbits.Carrinho.Produtos[p].ProdutoVarianteId.toString(),
        category: Fbits.Carrinho.Produtos[p].Categoria.toString(),
        quantity: Fbits.Carrinho.Produtos[p].Quantidade,
      });
    }

    window.dataLayer.push({
      'event': 'checkout',
      'ecommerce': {
        'checkout': {
          'actionField': {
            'step': 3
          },
          'products': dlp
        }
      }
    });

  });
</script>
