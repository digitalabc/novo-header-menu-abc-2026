<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produto - Guide Shop Experience</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://unpkg.com/@r2u/javascript-ar-sdk/dist/index.js"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="row g-5 p-4">
            <div class="col-md-2">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">
                            <strong>SKU: 261918</strong>
                        </p>
                        <p class="card-text">
                            Azulejo Monoporosa 32x60cm Retificado Tradizionale Bianco Brilhante La
                            Biancogres(Cód. Forn. BR0111I1)
                        </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div id="qrCode"></div>
                            <div id="ar-button"></div>
                        </div>
                    </div>
                </div>
                <a href="/guideshop-experience">Voltar</a>
            </div>
            <div class="col-md-8">
                <div id="3d-viewer"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

<script>
    ; (async () => {

        await R2U.init({ customerId: 'f8e75cbb-150d-4c22-92b6-77eff4a5a849' })
        const sku = (new URLSearchParams(window.location.search)).get('sku')?? false;
        const isActive = await R2U.sku.isActive(sku)
        
        if (sku && isActive) {
        

            // const qrCodeElement = document.getElementById('qrCode')
            // await R2U.qrCode.create({ qrCodeElement, sku })
            const fallbackOptions = {
                //adiciona a mensagem de alerta
                alertMessage: 'AR não suportado por esse device',
                //abre um visualizador 3D em uma tela de aviso
                fallback: 'viewer'
            }

            const arButton = document.getElementById('ar-button')
            await R2U.ar.attach({
                element: arButton,
                sku,
                fallbackOptions: fallbackOptions,
                showInstructions: 'always'
                // showInstructions: 'once' | 'always' | 'never'
            })

            const viewer = document.getElementById('3d-viewer')
            await R2U.viewer.create({
                element: viewer,
                sku,
                popup: false
            })

            // lembre-se de usar as informações do seu produto
            // R2U.ar.getLink(sku).then((url) => console.log(url))            
        }
    })()
</script>

</html>
