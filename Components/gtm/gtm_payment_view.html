{{ payment_id = payment_id != null ? payment_id[0]?.value : null }}
{{ if payment_id }}
<script>
    // Função para disparar o evento add_payment_info quando o usuário seleciona um meio de pagamento
    function sendPaymentInfoEvent(paymentMethod) {
        if (window.dataLayer && window.Fbits && window.Fbits.Carrinho) {
            const products = [];
            for (let p = 0; p < window.Fbits.Carrinho.Produtos.length; p++) {
                products.push({
                    item_id: window.Fbits.Carrinho.Produtos[p].ProdutoId.toString(),
                    item_name: window.Fbits.Carrinho.Produtos[p].Nome,
                    price: window.Fbits.Carrinho.Produtos[p].PrecoPor,
                    quantity: window.Fbits.Carrinho.Produtos[p].Quantidade
                });
            }
            
            window.dataLayer.push({
                'event': 'add_payment_info',
                'ecommerce': {
                    'payment_type': paymentMethod,
                    'currency': 'BRL',
                    'value': window.Fbits.Carrinho.ValorTotal,
                    'items': products
                }
            });
        }
    }

    // Adiciona listener para capturar a seleção do método de pagamento
    document.addEventListener('DOMContentLoaded', function() {
        // Observa mudanças no DOM para detectar quando os elementos de pagamento são carregados
        const observer = new MutationObserver(function(mutations) {
            const paymentOptions = document.querySelectorAll('[data-payment-method]');
            if (paymentOptions.length > 0) {
                paymentOptions.forEach(option => {
                    option.addEventListener('click', function() {
                        const paymentMethod = this.getAttribute('data-payment-method') || 'Método de pagamento';
                        sendPaymentInfoEvent(paymentMethod);
                    });
                });
                observer.disconnect();
            }
        });
        
        observer.observe(document.body, { childList: true, subtree: true });
    });
</script>
{{end}}
