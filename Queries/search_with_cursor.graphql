query ($searchQuery: String, 
  $partnerAccessToken: String, 
  $resultSize: Int = 12,
  $offset: Int, 
  $sortKey: ProductSearchSortKeys, 
  $sortDirection: SortDirection, 
  $filters: [ProductFilterInput],
  $minimumPrice: Decimal,
  $maximumPrice: Decimal) {
  search(query: $searchQuery, partnerAccessToken: $partnerAccessToken) {
    redirectUrl
    pageSize
    searchTime
    contents {
      content
      height
      title
      width 
      position
    }
    breadcrumbs{
      link
      text
    }
    productsByOffset(
      limit: $resultSize,
      offset: $offset,
      sortKey: $sortKey,
      sortDirection: $sortDirection,
      filters: $filters,
      minimumPrice: $minimumPrice,
      maximumPrice: $maximumPrice) {
      totalCount
      page
      pageSize
      items {
        id
        productId
        productName
        productVariantId
        alias
        similarProducts{
          alias
          image
          name
          imageUrl(w: 50, h: 50)
        }
        images(width:245, height:245) {
          url
          print
        }
        available
        prices {
          listPrice
          price
          discountPercentage
          multiplicationFactor
          installmentPlans{
            displayName
            name
            installments{
              discount
              fees
              number
              value
            }
          }
          bestInstallment {
            name
            displayName
            discount
            fees
            number
            value
          }
        }
        promotions{
          fullStampUrl
          content
          id
          stamp
          title
        }
        addToCartFromSpot
        attributes {
          name
          value
        }
      }
    }
    aggregations {
      filters {
        field
        values {
          name
          quantity
        }
      }
      priceRanges{
        range
        quantity
      }
      maximumPrice
      minimumPrice
    }
    banners {
      bannerUrl
      openNewTab
      width
      height
      order
      position
      title
      urlOnClick
    }
  }
}
