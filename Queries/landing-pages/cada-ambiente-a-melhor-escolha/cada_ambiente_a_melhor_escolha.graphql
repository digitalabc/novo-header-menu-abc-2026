query Hotsite($url: String!, $partnerAccessToken: String) {
  # Hotsite principal da LP /cada-ambiente-a-melhor-escolha:
  # hotsiteId: 102118
  # A consulta principal permanece por URL para respeitar a rota publicada.
  hotsite(url:$url) {
    name
    seo {
      content
      name
      type
      httpEquiv
      scheme
    }
    banners {
      altText
      bannerName
      bannerUrl
      position
      openNewTab
      height
      title
      width
      urlOnClick
    }
  }
  vitrine1: hotsite(hotsiteId: 102119, partnerAccessToken: $partnerAccessToken) {
    ...produtos
  }
}

fragment produtos on SingleHotsite {
  products(first: 20) {
    ...productsCon
  }
}

fragment productsCon on ProductsConnection {
  nodes {
    id
    productId
    productName
    productVariantId
    productBrand{
      name
      fullUrlLogo
      logoUrl
    }
    alias
    similarProducts{
      alias
      image
      name
      imageUrl(w: 50, h: 50)
    }
    images(width:245, height:245) {
      url
      print
    }
    available
    stock
    attributes {
      name
      value
    }
    prices {
      listPrice
      price
      discountPercentage
      multiplicationFactor
      installmentPlans{
        displayName
        name
        installments{
          discount
          fees
          number
          value
        }
      }
      bestInstallment {
        name
        displayName
        discount
        fees
        number
        value
      }
    }
    promotions{
      fullStampUrl
      content
      id
      stamp
      title
    }
    addToCartFromSpot
  }
}
