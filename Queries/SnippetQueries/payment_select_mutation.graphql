mutation (
  $checkoutId: Uuid!
  $paymentMethodId: ID!
  $customerAccessToken: String
  $orderId: Long
) {
  result: checkoutSelectPaymentMethod(
    checkoutId: $checkoutId
    paymentMethodId: $paymentMethodId
    customerAccessToken: $customerAccessToken
    orderId: $orderId
  ) {
    checkoutId
    completed
    products {
      imageUrl
      name
      quantity
    }
    selectedPaymentMethod {
      id
      html
      scripts
      paymentMethodId
      installments {
        adjustment
        number
        total
        value
      }
    }
    selectedAddress {
      cep
      city
      complement
      neighborhood
      state
      street
      addressNumber
      receiverName
    }
  }
}
