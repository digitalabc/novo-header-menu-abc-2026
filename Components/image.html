{{~ qs_var = "?" # if the source contains a query string or not ~}}
{{~ if source | string.contains "?" ~}}
    {{~ qs_var = "&" ~}}
{{~ end ~}}
<img srcset="
    {{- for s in sizes -}}
        {{- if !for.last -}}
            {{source}}{{qs_var}}w={{~s.w~}}&h={{~s.h~}}&v=no-change {{s.w~}}w,
        {{- else -}}
            {{source}}{{qs_var}}w={{~s.w~}}&h={{~s.h~}}&v=no-change {{s.w~}}w
        {{- end -}}
    {{- end ~}}"
    sizes="
    {{- for s in sizes -}}
        {{- if !for.last -}}
            (max-width: {{s.w}}px) {{s.w}}px,
        {{- else -}}
            {{s.w}}px
        {{- end -}}
    {{- end ~}}"
    width="{{sizes[0].w}}" height="{{sizes[0].h}}"
    src="{{source}}{{qs_var}}w={{~sizes[0].w~}}&h={{~sizes[0].h~}}&v=no-change"
    alt="{{alt}}"
    {{ if class }}class="{{class}}"{{ end }}
    {{ if loading }}loading="{{loading}}"{{ end }}
    {{ if decoding }}decoding="{{decoding}}"{{ end }}
    {{ if fetchpriority }}fetchpriority="{{fetchpriority}}"{{ end }}>
