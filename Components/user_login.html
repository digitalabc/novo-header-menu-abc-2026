{{ ##
    Description: Renders user component
    Params:
        - checkout_url: store checkout URL
    Usage:
        user_login checkout_url: url
## }}

<div class="user" id="user-login">
    <div class="user__header">
      <a href="{{checkout_url}}MinhaConta/Dados" aria-label="Minha Conta">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22.014" viewBox="0 0 22 22.014">
          <g id="Camada_2" data-name="Camada 2" transform="translate(0 -0.005)">
            <path id="Path_23274" data-name="Path 23274" d="M22,21.964a11.366,11.366,0,0,0-2.008-6.386,12.346,12.346,0,0,0-5.233-4.012A6.4,6.4,0,0,0,11.308.013a6.317,6.317,0,0,0-4.76,1.814A6.129,6.129,0,0,0,4.625,6.2a6.345,6.345,0,0,0,2.659,5.4l-.084.033a10.671,10.671,0,0,0-3.374,1.991,10.923,10.923,0,0,0-3.7,6.651c-.014.091-.023.183-.03.272a1.775,1.775,0,0,1-.091.5l0,.009v.962H1.815l0-.052A10.413,10.413,0,0,1,1.979,20.3a9,9,0,0,1,3.963-5.98,8.807,8.807,0,0,1,6.71-1.376,9.207,9.207,0,0,1,7.528,9.022v.053H22l0-.055ZM15.562,6.4a4.563,4.563,0,0,1-9.127-.011,4.6,4.6,0,0,1,4.559-4.555h.013A4.594,4.594,0,0,1,15.562,6.4Z" transform="translate(0 0)"/>
          </g>
        </svg>
      </a>
      <div class="user__links not-authenticated">
        <a class="user-href">Entre</a> ou <br>
        <a class="user-href user-register" >Cadastre-se</a>
      </div>
      <div class="user__links authenticated">
        <p>Olá, <span class="user-name"></span>!</p>
        <a class="user-account" href="{{checkout_url}}MinhaConta/Dados">Minha conta</a>
      </div>
    </div>

    <div class="user__dropdown" >
      <div class="user__content not-authenticated">
          <input type="hidden" id="login-url" value="{{ login_url }}">
          <i>
            <img src="https://abcdaconstrucao.fbitsstatic.net/sf/img/logo.svg" alt="ABC da Construção" title="ABC da Construção">         
          </i>
          <p>Conheça os benefícios de ser Prime! <a href="https://www.abcprime.shop/">Ver agora</a></p>
          <a class="user-href" id="user-href">
              <span>Entrar</span>
          </a>
          <p>Ainda não tem conta?</p>
          <input type="hidden" id="register-url" value="{{ register_url }}">
          <a class="user-href user-register" id="register-href">
              <span>Cadastre-se</span>
          </a>
      </div>
      <div class="user__content authenticated">
        <a class="dropdown-option" href="{{checkout_url}}MinhaConta/Dados">Minha conta</a>
        <a class="dropdown-option" href="{{checkout_url}}MinhaConta/Pedido">Meus pedidos</a>        
        <a id="logout-href" onclick="logout()" class="dropdown-option" href="/">Sair</a>
      </div>
    </div>
</div>
