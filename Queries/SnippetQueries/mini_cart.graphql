query Checkout($checkoutId: String!, $hasCheckout: Boolean!) {
  shop {
    checkoutUrl
  }  
  checkout(checkoutId:$checkoutId) @include(if: $hasCheckout) {
    checkoutId
    url
    products {
      url
      listPrice
      price
      ajustedPrice
      productId
      productVariantId
      imageUrl
      quantity
      name
      productAttributes{
        name
        type
        value
      }
    }
    shippingFee
    subtotal
    total
  }
}