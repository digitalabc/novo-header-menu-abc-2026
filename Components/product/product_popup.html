<style>
    .abc-fale-especialista-open {
        display: block !important;
    }

    .abc-fale-especialista-overlay {
        display: none;
        position: fixed;
        z-index: 999;
        padding: 0;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        overflow: auto;
        background-color: black;
        background-color: rgba(0, 0, 0, 0.4);
    }

    .abc-fale-especialista-modal {
        color: #7a7a7a;
        position: relative;
        margin: 100px auto;
        border: 1px solid #888;
        max-width: 80%;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2),
            0 6px 20px 0 rgba(0, 0, 0, 0.19);
        -webkit-animation-name: anime_top;
        -webkit-animation-duration: 0.4s;
        animation-name: anime_top;
        animation-duration: 0.4s;
    }

    @-webkit-keyframes anime_top {
        from {
            top: -300px;
            opacity: 0;
        }

        to {
            top: 0;
            opacity: 1;
        }
    }

    @keyframes anime_top {
        from {
            top: -300px;
            opacity: 0;
        }

        to {
            top: 0;
            opacity: 1;
        }
    }
    .abc-fale-especialista-modal .abc-fale-especialista-content {
        display: grid;
        position: relative;
    }
    .abc-fale-especialista-body-wrapper {
        position: absolute;
    }

    .abc-fale-especialista-top {
        background-color: #d0d0d0;
    }
    .abc-fale-especialista-bottom {
        background-color: #525252;
    }

    .abc-fale-especialista-top,
    .abc-fale-especialista-bottom {
        padding-block: 100px;
    }
    .abc-fale-especialista-modal .abc-fale-especialista-body-wrapper {
        background-color: #fff;

        width: 100%;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%) skewY(5deg);
        transform: translate(-50%, -50%) skewY(5deg);
    }
    .abc-fale-especialista-modal .abc-fale-especialista-body {
        transform: skewY(-5deg);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        padding: 50px 10px;
    }

    .abc-fale-especialista-modal .abc-fale-especialista-body > p {
        text-align: center;
        margin: 0;
    }

    .abc-fale-especialista-modal .abc-fale-especialista-body > p:nth-child(1) {
        font-size: 36px;
        line-height: 1;
    }

    .abc-fale-especialista-modal .abc-fale-especialista-body > p:nth-child(2) {
        font-size: 20px;
    }

    .abc-fale-especialista-modal
        .abc-fale-especialista-body
        > p:nth-child(1)
        > strong {
        color: #df1738ff;
        border-bottom: 1px solid #000;
    }

    .abc-fale-especialista-modal .abc-fale-especialista-btn {
        font-size: 18px;
        font-weight: bold;
        padding: 10px 30px;
        display: block;
        background: #fff;
        border-radius: 15px;
        clear: both;
        color: #e21937;
        text-align: center;
        cursor: pointer;
    }

    /* label checkbox*/
    .abc-fale-especialista-modal .label-container {
        position: relative;
        display: flex;
        flex-direction: row-reverse;
        gap: 10px;
        width: 100%;
        align-items: center;
        justify-content: flex-end;
        cursor: pointer;
        font-size: 22px;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    .abc-fale-especialista-whatsapp > a {
        text-decoration: none;
        color: #fff;
        background-color: #49c958ff;
        padding: 10px 15px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 16px;
    }

    @media (min-width: 768px) {
        .abc-fale-especialista-modal {
            max-width: 600px;
        }
    }
</style>
