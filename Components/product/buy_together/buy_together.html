{{~ if product.buy_together ~}}
  {{~ if product.buy_together.size > 0 ~}}
    <h2>Compre Junto</h2>
    <div class="buy-together">
      <div class="buy-together-content">
        {{~ for bt_product in product.buy_together ~}}
          <div class="container-buy-together-row">
            <div id="buy-together-row-{{ product.product_id }}-{{ bt_product.product_id }}"
                class="buy-together-row-div" 
                style="display: none;"
                buy-together-product-id = "{{ bt_product.product_id }}"       
                page-product-id = "{{ product.product_id }}"></div>
          </div>
        {{~ end ~}}
      </div>
    </div>
  {{~ end ~}}
{{~ end ~}}
