{{ ##
    Description: Google Tag Manager search component, saves the info of products
                to use when pushing the data to the datalayer
    Params:
        - product: the product data to save in tag manager
    Usage:
        gtm_search_view product: data.product
## }}
<script>
    window.dataLayer_search_details = {
        item_list_id: "search_results",
        item_list_name: "Search results",
        items: [
            {{~ for product in products ~}}
                {
                    item_id: {{product.product_id}},
                    item_name: "{{product.product_name | string.escape}}",
                    {{~ if product.prices ~}}
                        discount: {{product.prices.list_price - product.prices.price}},
                        price: {{product.prices.list_price}},
                    {{ end }}
                    index: {{for.index}},
                    {{ if product.product_brand}}
                        item_brand: "{{product.product_brand.name | string.escape}}",
                    {{ end }}
                    {{ i = 1 }}
                    {{ for category in product.product_categories }}
                        item_category{{if i > 1}}{{i}}{{end}}: "{{category.name | string.escape}}",
                        {{i = i + 1}}
                    {{ end }}
                    quantity: 1
                }{{if !for.last}},{{end}}
            {{~ end ~}}
        ]
    };
</script>
