query Common(
  $url: String!
  $scriptPageTypes: [ScriptPageType!]
  $partnerAccessToken: String
) {
  menuGroups(url: $url, partnerAccessToken: $partnerAccessToken) {
    menuGroupId
    position
    imageUrl
    fullImageUrl
    menus {
      menuId
      parentMenuId
      imageUrl
      fullImageUrl
      name
      cssClass
      link
      order
    }
  }
  scripts(url: $url, pageType: $scriptPageTypes) {
    name
    pageType
    position
    priority
    content
  }
  lighboxProducts: hotsite(
    hotsiteId: 204408
    partnerAccessToken: $partnerAccessToken
  ) {
    ...lighboxProducts
  }

  kits: hotsite(hotsiteId: 183759) {
    ...produtos
  }

  categories(first: 50, onlyRoot: true) {
    nodes {
      hotsiteAlias
      hotsiteUrl
      name
      position
      parentCategoryId
      children {
        hotsiteAlias
        hotsiteUrl
        name
        position
        children {
          hotsiteAlias
          hotsiteUrl
          name
          position
        }
      }
    }
  }
  gtm_id: shopSettings(settingNames: "GoogleTagManagerId") {
    name
    value
  }
  gtag_id: shopSettings(settingNames: "Google-Analytics-Ids") {
    name
    value
  }
  facebook_app_id: shopSettings(settingNames: "Facebook_Login_AppId") {
    name
    value
  }
  google_client_id: shopSettings(settingNames: "Google_Plus_Client_Id") {
    name
    value
  }
}

fragment lighboxProducts on SingleHotsite {
  products(first: 20, sortKey: SALES, sortDirection: DESC) {
    ...productsCon
  }
}

fragment produtos on SingleHotsite {
  products(first: 20, sortKey: SALES, sortDirection: DESC) {
    ...productsCon
  }
}

fragment productsCon on ProductsConnection {
  nodes {
    id
    productId
    productName
    productVariantId
    productBrand {
      fullUrlLogo
      logoUrl
    }
    alias
    similarProducts {
      alias
      image
      name
      imageUrl(w: 50, h: 50)
    }
    images(width: 245, height: 245) {
      url
      print
    }
    available
    prices {
      listPrice
      price
      priceTables {
        id
        listPrice
        price
      }
      discountPercentage
      multiplicationFactor
      installmentPlans {
        displayName
        name
        installments {
          discount
          fees
          number
          value
        }
      }
      bestInstallment {
        name
        displayName
        discount
        fees
        number
        value
      }
    }
    attributes {
      name
      value
    }
    promotions {
      fullStampUrl
      content
      id
      stamp
      title
    }
    addToCartFromSpot
  }
}
