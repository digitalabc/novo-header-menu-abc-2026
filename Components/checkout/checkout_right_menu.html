<div class="checkout-right-menu">
    {{ checkout_share_cart }}
    <div class="footer_mobile_bottom">
        <div class="price-line">
        <span>Você está economizando</span>
        <h3 class="discount">
            {{data.checkout.discount | math.format "c" "pt-BR"}}
        </h3>
        </div>
    <div class="price-line">
        <span>Valor total</span>
        <h3 class="total">{{data.checkout.total | math.format "c" "pt-BR"}}</h3>
    </div>
    </div>
    
    <!-- Botão Voltar para Desktop -->
    <div class="desktop-back-button-wrapper">
        <button class="checkout-back-button" onclick="history.back()" style="width: 100%; max-width: none;">Voltar</button>
    </div>
</div>
