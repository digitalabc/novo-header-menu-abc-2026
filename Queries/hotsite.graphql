query Hotsite($url: String!, $resultSize: Int, $offset: Int, $sortKey: ProductSortKeys, $sortDirection: SortDirection, $filters: [ProductFilterInput], $maximumPrice: Decimal, $minimumPrice: Decimal) {
  hotsite(url: $url) {
    name
    pageSize
    banners {
      bannerName
      bannerUrl
      position
      openNewTab
      height
      title
      width
    }
    contents {
      content
      height
      title
      width
      position
    }
    breadcrumbs {
      link
      text
    }
    seo {
      content
      name
      type
      httpEquiv
      scheme
    }
    productsByOffset(
      limit: $resultSize
      offset: $offset
      sortKey: $sortKey
      sortDirection: $sortDirection
      filters: $filters
      minimumPrice: $minimumPrice
      maximumPrice: $maximumPrice
    ) {
      totalCount
      page
      pageSize
      items {
        id
        productId
        productName
        productVariantId
        alias
        similarProducts {
          alias
          image
          name
          imageUrl(w: 50, h: 50)
        }
        images(width: 245, height: 245) {
          url
          print
        }
        available
        prices {
          listPrice
          price
          discountPercentage
          multiplicationFactor
          installmentPlans {
            displayName
            name
            installments {
              discount
              fees
              number
              value
            }
          }
          bestInstallment {
            name
            displayName
            discount
            fees
            number
            value
          }
        }
        promotions {
          content
          id
          stamp
          title
        }
        addToCartFromSpot
        attributes {
          name
          value
        }
      }
    }
    aggregations {
      maximumPrice
      minimumPrice
      filters {
        field
        values {
          name
          quantity
        }
      }
      priceRanges {
        quantity
        range
      }
    }
  }
}
