<span style="font-size: 18px;">Simule o frete e o prazo de entrega:</span>
<div class="product-shipping-quotes">
    <form onsubmit='ShippingQuoteSubmit(event, "{{ product_variant_id }}")'>
        <div class="quotes-form-group">
            <input type="text" id="shipping-quote-cep" name="shipping-quote-cep" 
                placeholder="Digite seu CEP aqui" maxlength="9" onkeypress="cepMask(this)">
            <input type="submit" value="OK">
        </div>
        <br>
    </form>
    <div id="shipping-quotes-snippet-div-{{ product_variant_id }}"></div>
</div>
