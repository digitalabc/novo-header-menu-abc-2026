query Hotsite($url: String!, $partnerAccessToken: String) {
  hotsite(url: $url) {
    name
    seo {
      content
      name
      type
      httpEquiv
      scheme
    }
    contents {
      content
      contentId
      position
      title
    }
  }
   kits: hotsite(hotsiteId: 99263, partnerAccessToken: $partnerAccessToken) {
    ...produtos
  }
}

fragment produtos on SingleHotsite {
  products(first: 20, sortKey: SALES, sortDirection: DESC) {
    ...productsCon
  }
}

fragment productsCon on ProductsConnection {
  nodes {
    id
    productId
    productName
    productVariantId
    productBrand {
      fullUrlLogo
      logoUrl
    }
    alias
    similarProducts {
      alias
      image
      name
      imageUrl(w: 50, h: 50)
    }
    images(width: 245, height: 245) {
      url
      print
    }
    available
    prices {
      listPrice
      price
      discountPercentage
      multiplicationFactor
      installmentPlans {
        displayName
        name
        installments {
          discount
          fees
          number
          value
        }
      }
      bestInstallment {
        name
        displayName
        discount
        fees
        number
        value
      }
    }
    promotions {
      fullStampUrl
      content
      id
      stamp
      title
    }
    addToCartFromSpot
  }
}
