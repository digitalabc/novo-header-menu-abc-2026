        }

            padding-block: 10px;

            color: #212529;

            font-style: normal;
        }

            gap: 10px;
            padding-top: 10px;

            border: 1px solid #000;
            padding: 10px;
        }

            border: 1.513px solid #E2E2E2;

            border-radius: 39.18px;

            text-align: center;

            font-size: 17.911px;
            font-style: normal;
            font-weight: 600;

        }

        .visite {
            background-color: #0B4864;
        }

        .comprar {
            background-color: #0FA848;
        }

        .voltar {
            text-decoration: none;
            padding: 5.787px 34.722px;
            border-radius: 25.318px;
            border: 0.723px solid #909090;
            color: #909090;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 13.433px;

    <div class="container-fluid">
        <div class="row g-5 p-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">
                            SKU:
                        </p>
                        <p class="card-text"></p>
                        <a class="visite" href="http://">Visite o produto</a>

                <a class="voltar" href="/guideshop-experience">Voltar</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

<script>
    ; (async () => {

        await R2U.init({ customerId: 'f8e75cbb-150d-4c22-92b6-77eff4a5a849' })
        const sku = (new URLSearchParams(window.location.search)).get('sku') ?? false;
        const isActive = await R2U.sku.isActive(sku)

        if (sku && isActive) {
            R2U.sku.getData(sku).then((info) => {
                // pdpUrl
                let cardText = document.querySelectorAll('.card-body .card-text');
                cardText[0].innerText = `SKU: ${sku}`;
                cardText[1].innerText = `${info.name}`;
                document.querySelector('.visite').setAttribute('href', info.pdpUrl);
                document.querySelector('.comprar').setAttribute('href', `https://checkout.abcdaconstrucao.com.br/produto/adicionar?p=${sku}`);
            });

            const fallbackOptions = {
                //adiciona a mensagem de alerta
                alertMessage: 'AR não suportado por esse device',
                //abre um visualizador 3D em uma tela de aviso
                fallback: 'viewer'
            }

            const arButton = document.getElementById('ar-button')
            await R2U.ar.attach({
                element: arButton,
                sku,
                fallbackOptions: fallbackOptions,
                // showInstructions: 'always'
                // showInstructions: 'once' | 'always' | 'never'
            })

            const viewer = document.getElementById('3d-viewer')
            await R2U.viewer.create({
                element: viewer,
                sku,
                // popup: false
            })

            const element = document.getElementById('qrCode');
            if (element) {
                await R2U.qrCode.create({ element, sku });
            }

        }
    })()
</script>

</html>
