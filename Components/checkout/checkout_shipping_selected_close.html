<h2 class="wake-checkout-title wake-checkout-shipping-title">Formas de envio</h2>
<span class="wake-checkout-shipping-subtitle wake-checkout-mb-4">Escolha a forma de envio</span>
<div class="wake-checkout-shipping-item">
    <div class="wake-checkout-shipping-item-content">
        <span class="wake-chekout-shipping-item-title">{{ shipping.name }}</span>
        <span class="wake-chekout-shipping-item-subtitle">{{ shipping.value | math.format "c" "pt-BR" }}</span>
        <span class="wake-chekout-shipping-item-desc">Em até {{ shipping.deadline }} dias uteis</span>
    </div>
</div>
<button class="wake-checkout-shipping-button" onclick="renderOptionsShipping()">
    Trocar forma de envio
</button>
