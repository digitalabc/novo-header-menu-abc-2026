query Common($url: String!, $scriptPageTypes: [ScriptPageType!]) {
  menuGroups(url:$url) {
    menuGroupId
    position
    menus {
      menuId
      parentMenuId
      name
      cssClass
      link
    }  
  }
  scripts(url:$url, pageType:$scriptPageTypes) {
    name
    pageType
    position
    priority
    content
  }
  lighboxProducts: search(query: "") {
    ...lighboxProducts
  }
  categories(first: 50) {
    nodes {
      hotsiteAlias
      hotsiteUrl
      name
      position
      parentCategoryId
      children {
        hotsiteAlias
        hotsiteUrl
        name
        position
        children {
          hotsiteAlias
          hotsiteUrl
          name
          position
        }
      }
    }
  }
  gtm_id: shopSettings(settingNames: "Fbits-GoogleAnalyticsId") {
    name
    value
  }
}

fragment lighboxProducts on Search {
  products(first: 9, sortKey: RELEASE_DATE, sortDirection: DESC) {
    ...productsCon
  }
}

fragment productsCon on ProductsConnection {
  nodes {
    id
    productId
    productName
    productVariantId
    productBrand{
      fullUrlLogo
      logoUrl
    }
    alias
    similarProducts{
      alias
      image
      name
      imageUrl(w: 50, h: 50)
    }
    images(width:245, height:245) {
      url
      print
    }
    available
    prices {
      listPrice
      price
      discountPercentage
      multiplicationFactor
      installmentPlans{
        displayName
        name
        installments{
          discount
          fees
          number
          value
        }
      }
      bestInstallment {
        name
        displayName
        discount
        fees
        number
        value
      }
    }
    attributes {
      name
      value
    }
    promotions{
      content
      id
      stamp
      title
    }
    addToCartFromSpot
  }
}
