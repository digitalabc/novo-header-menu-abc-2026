{{~ if data.checkout.products.size > 0 ~}} 
  {{ checkout_products_list products: data.checkout.products kits: data.checkout.kits }}
{{~ else ~}}
  <div class="wake-cart-container-empty">
    <img src="{{- store.urls.static_img}}icons/empty-orders.svg?theme={{store.theme}}&v={{store.last_modified}}">
    <h3>Carrinho de compras está vazio</h3>
    <p>Você não possui itens no carrinho</p>
    <a href="/" type="button">
      Continue comprando
    </a>
  </div>
{{~ end ~}}
